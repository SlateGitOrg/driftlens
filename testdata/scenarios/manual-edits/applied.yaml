apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: manual-edits
  labels: {app: api, team: payments}
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: ghcr.io/example/api:1.4.2
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: PORT, value: "8080"}
