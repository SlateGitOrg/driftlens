apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: csa-three-way
data:
  LOG_LEVEL: info
  TIMEOUT: 30s
  CACHE: "on"
  LEGACY_ENDPOINT: http://old.internal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: csa-three-way
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: ghcr.io/example/worker:3.2.0
          env:
            - {name: QUEUE, value: jobs}
            - {name: FEATURE_BATCHING, value: "true"}
