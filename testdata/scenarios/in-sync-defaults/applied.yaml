apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: in-sync-defaults
  labels: {app: web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: nginx:1.27.2
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {cpu: 1000m, memory: 1024Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 80}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
          volumeMounts:
            - {name: config, mountPath: /etc/web}
      volumes:
        - name: config
          configMap: {name: web-config}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: in-sync-defaults
spec:
  selector: {app: web}
  ports:
    - name: http
      port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-nodeport
  namespace: in-sync-defaults
spec:
  type: NodePort
  selector: {app: web}
  ports:
    - port: 8080
      targetPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: in-sync-defaults
data:
  nginx.conf: |
    server { listen 80; }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: in-sync-defaults
spec:
  serviceName: db
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
        - name: postgres
          image: postgres:17
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent
  namespace: in-sync-defaults
spec:
  selector:
    matchLabels: {app: agent}
  template:
    metadata:
      labels: {app: agent}
    spec:
      containers:
        - name: agent
          image: busybox
          command: [sleep, infinity]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report
  namespace: in-sync-defaults
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: busybox:1.36
              args: [echo, done]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web
  namespace: in-sync-defaults
spec:
  podSelector:
    matchLabels: {app: web}
  ingress:
    - ports:
        - port: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: web-token
  namespace: in-sync-defaults
stringData:
  token: not-a-real-secret
